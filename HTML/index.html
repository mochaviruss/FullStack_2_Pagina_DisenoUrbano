<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema - Diseno Urbano</title>
    <link rel="stylesheet" href="v3.0estilos_comunes.css">
</head>
<body>
    <div class="hero-section">
        <header class="navbar">
            <div>
                <h1>Portal de Proyectos</h1>
                <p class="hero-subtitle">Sistema Integrado de Gestion Arquitectonica y Diseno Urbano</p>
            </div>
        </header>
    </div>

    <main class="main-container">
        
        <!-- 1. CARRUSEL ARRIBA Y CENTRADO -->
        <section class="carrusel-top-container">
            <div class="carrusel-wrapper">
                <div class="carrusel-track">
                    <img src="Banner1.jpg" alt="Banner 1">
                    <img src="Banner2.jpg" alt="Banner 2">
                    <img src="Banner3.jpg" alt="Banner 3">
                </div>
            </div>
        </section>

        <!-- 2. GRILLA EN DOS COLUMNAS: VIDEO (IZQ) Y LOGIN (DER) -->
        <div class="panel-grid">
            
            <!-- COLUMNA IZQUIERDA: VIDEO -->
            <article class="card">
                <span class="card-number">NR. 01</span>
                <h2>Recorrido Virtual</h2>
                <video controls width="100%" style="border-radius: 8px; border: 1px solid #e5e5e7;">
                    <source src="recorrido.mp4" type="video/mp4">
                    Tu navegador no soporta videos.
                </video>
            </article>

            <!-- COLUMNA DERECHA: LOGIN -->
            <article class="card">
                <span class="card-number">NR. 02</span>
                <h2>Acceso al Sistema</h2>
                
                <div class="form-group">
                    <label for="rol-usuario">Seleccionar Perfil / Rol</label>
                    <select id="rol-usuario">
                        <option value="" disabled selected>-- Seleccione su Perfil --</option>
                        <option value="cliente_dashboard.html">Cliente / Inversionista</option>
                        <option value="arq_dashboard.html">Arquitecto Proyectista</option>
                        <option value="coordinador_dashboard.html">Coordinador de Proyecto</option>
                        <option value="disenador_dashboard.html">Diseñador Urbano</option>
                        <option value="ing_dashboard.html">Ingeniero Calculista</option>
                        <option value="admin_dashboard.html">Administrador del Sistema</option>
                    </select>
                    <div id="error-login" class="error-msg" style="display: none;">
                        Por favor, seleccione un perfil para ingresar.
                    </div>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn btn-primario" onclick="ingresarSistema()">Ingresar</button>
                    <button type="reset" class="btn btn-alerta" onclick="document.getElementById('rol-usuario').value=''">Limpiar</button>
                </div>
            </article>

        </div>
    </main>

    <!-- MODAL INDEPENDIENTE PARA ZOOM -->
    <div id="modal-zoom" class="modal-zoom">
        <span class="modal-cerrar">&times;</span>
        <img id="img-modal-target" src="" alt="Zoom Imagen">
    </div>

    <footer style="text-align: center; padding: 20px; color: #a0a0a5; font-size: 0.8rem;">
        <p>&copy; 2026 Diseno Urbano Team-Panco. Soporte: TeamPanco@ShelterBuildings.com</p>
    </footer>

    <script src="index_logica.js"></script>
</body>
</html>
