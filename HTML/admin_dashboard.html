<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administracion</title>
    <link rel="stylesheet" href="v3.0estilos_comunes.css">
</head>
<body>

    <div class="hero-section">
        <header class="navbar">
            <div>
                <h1>Panel de Administracion</h1>
                <p class="hero-subtitle">Reportes consolidado de avance y gestion financiera de proyectos</p>
            </div>
            <nav style="display: flex; gap: 10px;">
                <a href="index.html" class="btn btn-nav" style="text-decoration: none; display: inline-flex; align-items: center;">← Volver al Login</a>
                <button class="btn btn-nav" onclick="reiniciarPruebas()">Reiniciar Datos</button>
            </nav>
        </header>
    </div>

    <main class="main-container">
        <section>
            <article class="card">
                <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px;">
                    <div>
                        <span class="card-number">NR. 01</span>
                        <h2 style="margin-bottom: 0; border-bottom: none;">Consolidado de Proyectos</h2>
                    </div>
                    <button class="btn btn-exito" style="width: auto; padding: 12px 24px;" onclick="exportarExcel()">Exportar a Excel</button>
                </div>

                <div style="overflow-x: auto; margin-top: 20px;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Codigo</th>
                                <th>Proyecto</th>
                                <th>Avance</th>
                                <th>Costo Estimado</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-reportes">
                            <!-- Inyeccion dinamica de JS -->
                        </tbody>
                    </table>
                </div>
            </article>
        </section>
    </main>

    <footer style="text-align: center; padding: 20px; color: #a0a0a5; font-size: 0.8rem;">
        <p>&copy; 2026 Diseno Urbano Team-Panco. Soporte: TeamPanco@ShelterBuildings.com</p>
    </footer>

    <script src="admin_logica.js"></script>
</body>
</html>
