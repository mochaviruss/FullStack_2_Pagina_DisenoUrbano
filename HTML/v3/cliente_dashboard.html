<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal del Cliente - Diseño Urbano</title>
    <link rel="stylesheet" href="estilos_comunes.css">
</head>
<body>

    <!-- Header Hero con imagen de arquitectura -->
    <div class="hero-section">
        <header class="navbar">
            <div>
                <h1>Portal del Cliente</h1>
                <p class="hero-subtitle">¡Bienvenido! Aquí puedes revisar el estado y avance de tus proyectos</p>
            </div>
            <div>
                <button class="btn btn-nav" onclick="window.location.href='index.html'">← Volver al Login</button>
                <button class="btn btn-nav" onclick="reiniciarPruebas()" style="margin-left: 10px;">Reiniciar Datos</button>
            </div>
        </header>
    </div>

    <!-- Contenedor principal Ark-Shelter -->
    <main class="main-container">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 25px;">
                <div>
                    <span class="card-number">NR. 01</span>
                    <h2 style="margin-bottom: 0; border-bottom: none;">Mis Proyectos</h2>
                </div>
                <button class="btn btn-alerta" style="width: auto; padding: 12px 24px;" onclick="reiniciarPruebas()">
                    Descargar Informe
                </button>
            </div>

            <!-- Inyección dinámica de proyectos por JS -->
            <div id="contenedor-proyectos">
                <!-- Se inyecta vía JS -->
            </div>
        </div>
    </main>

    <script src="cliente_logica.js"></script>
</body>
</html>
