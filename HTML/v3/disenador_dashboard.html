<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Diseño Gráfico</title>
    <link rel="stylesheet" href="estilos_comunes.css">
</head>
<body>

    <div class="hero-section">
        <header class="navbar">
            <div>
                <h1>Panel de Diseño Gráfico</h1>
                <p class="hero-subtitle">Módulo de entregables y revisión de solicitudes</p>
            </div>
            <div>
                <button class="btn btn-nav" onclick="window.location.href='index.html'">← Volver al Login</button>
                <button class="btn btn-nav" onclick="reiniciarPruebas()" style="margin-left: 10px;">Reiniciar Datos</button>
            </div>
        </header>
    </div>

    <main class="main-container">
        <div class="panel-grid">
            
            <!-- Columna 1 -->
            <div class="columna">
                <div class="card">
                    <span class="card-number">NR. 01</span>
                    <h2>Gestionar Solicitud</h2>
                    
                    <div class="form-group">
                        <label>Solicitud Pendiente</label>
                        <select id="solicitud-actual">
                            <option value="SOL01">Render Fachada Principal</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <textarea id="motivo-rechazo" placeholder="Especifique el motivo en caso de rechazo..." style="display:none;"></textarea>
                        <div id="err-rechazo" class="error-msg">Debe ingresar un motivo para rechazar.</div>
                    </div>
                    
                    <div class="btn-group">
                        <button class="btn btn-exito" onclick="aceptarSolicitud()">Aceptar</button>
                        <button class="btn btn-alerta" onclick="rechazarSolicitud()">Rechazar</button>
                    </div>
                </div>
            </div>

            <!-- Columna 2 -->
            <div class="columna">
                <div class="card">
                    <span class="card-number">NR. 02</span>
                    <h2>Entrega de Material Visual</h2>
                    
                    <div class="form-group">
                        <label>Destinatario / Cliente</label>
                        <select id="dg-destinatario">
                            <option value="">-- Seleccione Cliente --</option>
                            <option value="C01">Cliente Inmobiliaria Sur</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Notas de avance</label>
                        <textarea id="dg-notas" placeholder="Detalle las observaciones de la entrega..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Adjuntar Archivo (.pdf, .png, .zip, .ai, .psd)</label>
                        <input type="file" id="dg-archivo" accept=".pdf,.png,.jpeg,.zip,.ai,.psd,.pptx">
                        <div id="err-dg-archivo" class="error-msg"></div>
                    </div>

                    <button class="btn btn-primario" style="width: 100%; margin-top: 10px;" onclick="enviarMaterial()">Enviar Material</button>
                </div>
            </div>

        </div>
    </main>

    <script src="disenador_logica.js"></script>
</body>
</html>
